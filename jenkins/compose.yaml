name: boutique-jenkins
services:
  release-controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    ports:
    - 127.0.0.1:8091:8080
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:?required}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?required}
      JENKINS_URL: ${JENKINS_RELEASE_URL:-http://127.0.0.1:8091/}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx1024m
      BOUTIQUE_CONTROLLER_ROLE: release
      BOUTIQUE_CI_LIBRARY_REF: ${BOUTIQUE_CI_LIBRARY_REF:?Set a reviewed full boutique-ci
        commit SHA}
      BOUTIQUE_DEV_ORIGIN: ${BOUTIQUE_DEV_ORIGIN:-https://dev.boutique.test:8443}
      BOUTIQUE_STAGING_ORIGIN: ${BOUTIQUE_STAGING_ORIGIN:-https://staging.boutique.test:8443}
      BOUTIQUE_PRODUCTION_ORIGIN: ${BOUTIQUE_PRODUCTION_ORIGIN:-https://production.boutique.test:9443}
      JENKINS_PLATFORM_ADMIN_PASSWORD: ${JENKINS_PLATFORM_ADMIN_PASSWORD:?Run scripts/init-local.sh}
    volumes:
    - release-home:/var/jenkins_home
    restart: unless-stopped
volumes:
  release-home: null
